<meta charset="utf-8">
<title>Peptide Protocol Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#E9EEEC; --border:#D3DBD8; --divider:#E3E9E7;
    --ink:#16201D; --muted:#5C6966; --faint:#8C9895;
    --accent:#3D4FC4; --accent-ink:#FFFFFF; --accent-soft:#E4E7FA; --accent-line:#B7BEEF;
    --good:#1F7A4D; --good-soft:#DDF1E6; --warn:#9A6400; --warn-soft:#FFF3CF; --today-soft:#FFF8E1; --bad:#BE3B3B; --bad-soft:#F9E0E0;
    --shadow:0 1px 2px rgba(22,32,29,.06), 0 8px 24px rgba(22,32,29,.06);
    --font-display:'Manrope', 'Segoe UI', system-ui, sans-serif;
    --font-body:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, Consolas, monospace;
    --r-sm:6px; --r-md:10px; --r-lg:14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0F1513; --surface:#171E1C; --surface-2:#1F2826; --border:#2C3735; --divider:#243030;
      --ink:#E6ECE9; --muted:#A2AEAA; --faint:#6F7B78;
      --accent:#8E9CFF; --accent-ink:#0F1513; --accent-soft:#252B4D; --accent-line:#3F4A8F;
      --good:#6CCB95; --good-soft:#173325; --warn:#F0B35A; --warn-soft:#3A2F14; --today-soft:#2E2812; --bad:#F08080; --bad-soft:#3D1A1A;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0F1513; --surface:#171E1C; --surface-2:#1F2826; --border:#2C3735; --divider:#243030;
    --ink:#E6ECE9; --muted:#A2AEAA; --faint:#6F7B78;
    --accent:#8E9CFF; --accent-ink:#0F1513; --accent-soft:#252B4D; --accent-line:#3F4A8F;
    --good:#6CCB95; --good-soft:#173325; --warn:#F0B35A; --warn-soft:#3A2F14; --today-soft:#2E2812; --bad:#F08080; --bad-soft:#3D1A1A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--font-body); -webkit-text-size-adjust:100%; }
  button, input, select, textarea { font:inherit; color:inherit; }
  h1,h2,h3,h4,p { margin:0; }
  h1,h2,h3 { font-family:var(--font-display); text-wrap:balance; }
  a { color:var(--accent); }
  .num { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .app { max-width:none; margin:0; padding:16px 24px 64px; }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) clamp(320px, 26vw, 420px); gap:24px; align-items:start; }
  .side { position:sticky; top:52px; max-height:calc(100vh - 64px); overflow:auto; padding-top:18px; }
  .side .card { padding:12px; }
  .side .prog-meta { grid-template-columns:1fr 1fr; gap:6px 10px; margin:8px 0; font-size:12px; }
  .side h3 { font-size:14px; }
  .side .section-head h3 { font-size:15px; font-weight:700; }
  .side .empty { padding:16px 12px; }
  .side.fit { position:static; padding-top:0; height:0; min-height:100%; max-height:none; overflow-y:auto; scrollbar-width:thin; }
  .side.fit .section-head { position:sticky; top:0; background:var(--bg); z-index:1; padding-bottom:6px; margin-bottom:4px; }
  .vial-mini { padding:8px 10px; background:var(--surface-2); border-color:var(--divider); }
  .vial-mini.dragging { background:var(--accent-soft); }
  .vial-mini[draggable="true"] { cursor:grab; }
  .vial-mini.dragging { opacity:.45; }
  .vial-mini .grip { color:var(--faint); font-size:12px; letter-spacing:-2px; cursor:grab; user-select:none; }

  .vial-mini .bar { height:6px; }
  .vial-mini .bar.low > i { background:var(--warn); }
  .vial-mini a { color:var(--muted); }
  @media (max-width:900px) { .side.fit { height:auto; min-height:0; max-height:none; } }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; } .side { position:static; max-height:none; overflow:visible; } }
  @media (max-width:640px) { .app { padding:12px 12px 64px; } }

  /* top bar */
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0 14px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-mark { width:36px; height:36px; border-radius:10px; background:var(--accent); display:grid; place-items:center; color:var(--accent-ink); }
  .brand h1 { font-size:18px; font-weight:800; letter-spacing:-.01em; }
  .brand .sub { font-size:12px; color:var(--muted); }
  .topbar-right { display:flex; align-items:center; gap:8px; }
  .storage { font-size:12px; color:var(--muted); display:inline-flex; align-items:center; gap:6px; padding:4px 8px; border:1px solid var(--border); border-radius:999px; background:var(--surface); }
  .storage i { width:8px; height:8px; border-radius:50%; background:var(--faint); display:inline-block; }
  .storage.cloud i { background:var(--good); }
  .storage.local i { background:var(--warn); }

  /* jump nav */
  .jump { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; padding:8px 0; margin-bottom:8px; background:var(--bg); border-bottom:1px solid var(--border); }
  .tabs { display:flex; flex-wrap:wrap; gap:4px; align-items:center; min-width:0; }
  .tab .mark { display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:6px; vertical-align:middle; }
  .tab .mark.due { background:var(--warn); } .tab .mark.missed { background:var(--bad); }
  .tab[aria-selected="true"] .mark { background:var(--accent-ink); }
  .tab { appearance:none; border:0; background:none; color:var(--muted); font-weight:700; font-size:15px; padding:8px 14px; border-radius:999px; white-space:nowrap; cursor:pointer; }
  .tab:hover { color:var(--ink); background:var(--surface-2); }
  .tab[aria-selected="true"] { color:var(--accent-ink); background:var(--accent); }
  .tab[aria-selected="true"] .badge { background:var(--accent-ink); color:var(--accent); }
  .view { display:none; } .view.active { display:block; }
  .jump .badge { display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:999px; background:var(--accent); color:var(--accent-ink); font-size:11px; text-align:center; line-height:18px; }
  .tab:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .sec { scroll-margin-top:56px; padding-top:18px; margin-bottom:12px; }
  .sec > .section-head h2 { font-size:20px; font-weight:800; letter-spacing:-.01em; }
  .now-line { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:10px; padding:12px 14px; background:var(--accent-soft); border-radius:var(--r-md); }
  .now-line .big { font-family:var(--font-mono); font-size:30px; font-weight:600; line-height:1; }
  .now-line .big small { font-size:14px; color:var(--muted); margin-left:3px; font-weight:500; }
  .now-line .gauge { margin:0; flex:1 1 260px; max-width:440px; }
  .now-line .days { padding-bottom:2px; }
  .mini { width:150px; height:18px; display:block; }
  .grid-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:10px; }
  .compact { padding:12px 14px; }
  .compact.done { border-color:var(--good); }
  .compact .title { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .compact .title h3 { font-size:15px; font-weight:800; }
  .compact .title h3 a { color:inherit; text-decoration:none; }
  .compact .title h3 a:hover { color:var(--accent); }
  .compact .dose { display:flex; align-items:baseline; gap:8px; margin:6px 0 4px; }
  .compact .dose .u { font-family:var(--font-mono); font-size:26px; font-weight:600; line-height:1; }
  .compact .dose .u small { font-size:13px; color:var(--muted); margin-left:2px; font-weight:500; }
  .compact .dose .rest { font-family:var(--font-mono); font-size:13px; color:var(--muted); }
  .compact .line { font-size:12px; color:var(--muted); margin-top:4px; }
  .compact .foot { display:flex; align-items:center; gap:6px; margin-top:8px; }
  .due-row { display:grid; grid-template-columns:minmax(200px,1fr) auto auto; grid-template-areas:"who stats acts" "syr syr syr"; gap:6px 24px; align-items:center; padding:12px 18px; }
  .due-row .who { grid-area:who; }
  .due-row .who.inline { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .due-row .who.inline h3 { font-size:16px; font-weight:800; }
  .due-row .who.inline h3 a { color:inherit; text-decoration:none; }
  .due-row .who.inline h3 a:hover { color:var(--accent); }
  .due-row .who.inline .line { margin:0; font-size:13px; }
  .due-row .title .inline-meta { margin:0; font-size:13px; } .due-row .stats { grid-area:stats; } .due-row .acts { grid-area:acts; } .due-row .syr { grid-area:syr; }
  .due-row.done { border-color:var(--good); }
  .due-row .title { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .due-row .title h3 { font-size:16px; font-weight:800; }
  .due-row .title h3 a { color:inherit; text-decoration:none; }
  .due-row .title h3 a:hover { color:var(--accent); }
  .due-row .line { font-size:12px; color:var(--muted); margin-top:4px; }
  .due-row .stats { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
  .segs { display:inline-grid; grid-auto-flow:column; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--surface); }
  .seg { padding:4px 14px 5px; border-left:1px solid var(--border); min-width:78px; text-align:center; }
  .seg:first-child { border-left:0; }
  .seg .k { font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; line-height:1.2; }
  .seg .v { font-family:var(--font-mono); font-size:16px; font-weight:600; line-height:1.2; white-space:nowrap; }
  .seg .v small { font-size:11px; font-weight:500; color:var(--muted); }
  .seg.primary { background:var(--good-soft); }
  .seg.primary .v { color:var(--good); }
  .seg.primary .v small { color:var(--good); opacity:.85; }
  .seg-note { font-size:11px; color:var(--faint); padding-right:2px; }
  .segs-cap { font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600; text-align:center; width:100%; padding:2px 0; margin-bottom:2px; line-height:1.2; }
  .plan-row .stats { align-items:center; }
  .due-row .syr .gauge { margin:0; max-width:none; }
  .due-row .acts { display:flex; gap:8px; justify-content:flex-end; align-items:center; height:40px; }
  .due-row .who.inline { height:auto; }
  @media (max-width:640px) { .due-row { grid-template-columns:1fr; grid-template-areas:"who" "stats" "syr" "acts"; } }
  .plan-row { grid-template-columns:auto minmax(0,1fr) auto auto; grid-template-areas:"who mid stats acts" "days days days days"; }
  .plan-row .mid { grid-area:mid; justify-self:center; }
  .meta { display:flex; gap:20px; align-items:flex-start; }
  .meta .m { text-align:center; }
  .meta .k { font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; line-height:1.2; }
  .meta .v { font-size:14px; font-weight:600; line-height:1.3; white-space:nowrap; }
  .plan-row .days { grid-area:days; }
  .plan-row:not(.active) { grid-template-areas:"who mid stats acts"; }
  .days { overflow-x:auto; overflow-y:hidden; padding:2px 0 8px; scrollbar-width:thin; min-width:0; max-width:100%; width:100%; }
  .days::-webkit-scrollbar { height:8px; }
  .days::-webkit-scrollbar-thumb { background:var(--border); border-radius:999px; }
  .now-line > div { min-width:0; }
  .plan-row .days { min-width:0; }
  .ddots { display:flex; gap:4px; width:max-content; padding:14px 3px 0; align-items:flex-end; }
  .dd { position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; flex:none; width:22px; }
  .dd b { display:block; width:18px; height:18px; border-radius:4px; border:1.5px solid var(--border); background:var(--surface-2); }
  .dd small { font-size:9px; line-height:1; color:var(--faint); font-family:var(--font-mono); }
  .dd i { position:absolute; top:-13px; left:0; font-size:9px; font-style:normal; font-weight:600; color:var(--muted); white-space:nowrap; letter-spacing:.04em; text-transform:uppercase; }
  .dd.future b { background:var(--accent-soft); border-color:var(--accent); }
  .dd.future small { color:var(--muted); }
  .dd.done b { background:var(--good); border-color:var(--good); }
  .dd.missed b { background:var(--bad); border-color:var(--bad); }
  .dd.due b { background:var(--warn); border-color:var(--warn); }
  .dd.skipped b { background:var(--surface); border-color:var(--border); background-image:linear-gradient(135deg, transparent 45%, var(--faint) 45%, var(--faint) 55%, transparent 55%); }
  .dd.today b { outline:2px solid var(--accent); outline-offset:1px; }
  .dd.today small { color:var(--accent); font-weight:600; }
  .ddots .gap { flex:none; align-self:stretch; display:flex; align-items:center; padding:0 6px; margin:0 4px; border-left:1px dashed var(--border); border-right:1px dashed var(--border); }
  .ddots .gap i { font-size:9px; font-style:normal; color:var(--faint); white-space:nowrap; letter-spacing:.04em; text-transform:uppercase; }
  .dot.due { background:var(--warn); border-color:var(--warn); }
  .dot.future { background:var(--surface); border-color:var(--accent-line); }
  .dot.today { outline:2px solid var(--accent); outline-offset:1px; }
  @media (max-width:640px) { .plan-row { grid-template-columns:1fr; grid-template-areas:"who" "mid" "stats" "days" "acts"; } .plan-row:not(.active) { grid-template-areas:"who" "mid" "stats" "acts"; } }
  .plan-row.done { opacity:.4; }
  .plan-row.done:hover, .plan-row.done:focus-visible { opacity:.75; }
  .tab.done-tab { opacity:.45; }
  .card.click { cursor:pointer; }
  .card.click:hover, .card.click:focus-visible { border-color:var(--accent-line); box-shadow:var(--shadow); }
  .card.click .faint { font-size:20px; line-height:1; }

  /* layout bits */
  .section { margin-bottom:24px; }
  .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; }
  .section-head h2 { font-size:15px; font-weight:700; }
  .section-head .hint { font-size:12px; color:var(--muted); }
  .stack { display:grid; gap:10px; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .spacer { flex:1; }
  .muted { color:var(--muted); }
  .faint { color:var(--faint); }
  .small { font-size:12px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:16px; }
  .card.lift { box-shadow:var(--shadow); }

  /* summary strip */
  .strip { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:16px; }
  .tile { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:12px 14px; }
  .tile .k { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .tile .v { font-family:var(--font-display); font-size:26px; font-weight:800; line-height:1.15; margin-top:2px; }
  .tile.good .v { color:var(--good); } .tile.warn .v { color:var(--warn); } .tile.bad .v { color:var(--bad); }

  /* dose card */
  .dose-card { display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:16px; align-items:start; }
  .dose-card.done { border-color:var(--good); }
  .dose-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .dose-head h3 { font-size:17px; font-weight:800; }
  .dose-big { display:flex; align-items:baseline; gap:14px; margin:10px 0 6px; flex-wrap:wrap; }
  .dose-big .units { font-family:var(--font-mono); font-size:38px; font-weight:600; line-height:1; letter-spacing:-.02em; }
  .dose-big .units small { font-size:16px; color:var(--muted); font-weight:500; margin-left:2px; }
  .dose-big .mg { font-family:var(--font-mono); font-size:18px; color:var(--muted); }
  .vial-line { font-size:13px; color:var(--muted); display:flex; gap:6px 14px; flex-wrap:wrap; }
  .vial-line b { color:var(--ink); font-weight:600; }
  .dose-actions { display:grid; gap:8px; }
  .note-box { margin-top:10px; padding:10px 12px; background:var(--surface-2); border-radius:var(--r-sm); font-size:13px; white-space:pre-wrap; }

  /* syringe gauge */
  .gauge { margin-top:8px; max-width:440px; }
  .gauge svg { width:100%; height:auto; display:block; }

  /* chips */
  .chip { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; line-height:18px; border:1px solid transparent; }
  .chip.accent { background:var(--accent-soft); color:var(--accent); }
  .chip.good { background:var(--good-soft); color:var(--good); }
  .chip.warn { background:var(--warn-soft); color:var(--warn); }
  .chip.bad { background:var(--bad-soft); color:var(--bad); }
  .chip.plain { background:var(--surface-2); color:var(--muted); }

  /* buttons */
  .btn { appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:var(--r-md); padding:9px 14px; font-weight:600; cursor:pointer; min-height:40px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn:hover { background:var(--surface-2); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover { filter:brightness(1.08); }
  .btn.good { background:var(--good); border-color:var(--good); color:#fff; }
  .btn.danger { color:var(--bad); }
  .btn.sm { padding:5px 10px; min-height:30px; font-size:13px; }
  .btn.ghost { border-color:transparent; background:transparent; }
  .btn.ghost:hover { background:var(--surface-2); }
  .btn[disabled] { opacity:.5; cursor:not-allowed; }

  /* adherence dots */
  .dots { display:flex; gap:4px; align-items:center; }
  .dot { width:12px; height:12px; border-radius:3px; background:var(--surface-2); border:1px solid var(--border); }
  .dot.done { background:var(--good); border-color:var(--good); }
  .dot.missed { background:var(--bad); border-color:var(--bad); }
  .dot.off { opacity:.35; }

  /* tables */
  .table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--divider); vertical-align:middle; white-space:nowrap; }
  th { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; background:var(--surface-2); }
  tr:last-child td { border-bottom:0; }
  tr.current td { background:var(--accent-soft); }
  td.num, th.num { text-align:right; }
  tr.occ.today td { background:var(--today-soft); box-shadow:inset 3px 0 0 var(--warn); }
  tr.occ.late td { background:var(--bad-soft); box-shadow:inset 3px 0 0 var(--bad); }
  tr.occ.today td:first-child, tr.occ.late td:first-child { box-shadow:inset 3px 0 0 var(--warn); }
  tr.occ.late td:first-child { box-shadow:inset 3px 0 0 var(--bad); }
  tr.occ.today td:not(:first-child), tr.occ.late td:not(:first-child) { box-shadow:none; }
  tr.occ.done td { color:var(--muted); }
  tr.occ.skipped td { color:var(--faint); }
  tr.occ.skipped td:first-child { text-decoration:line-through; }
  td.actions { text-align:right; }
  td.actions .btn + .btn { margin-left:4px; }
  .occ-wrap summary { font-size:14px; }

  /* program card */
  .prog-card h3 { font-size:16px; font-weight:800; }
  .card-trio { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) clamp(300px, 24vw, 400px); gap:16px; align-items:stretch; }
  .vials-card { display:flex; flex-direction:column; height:0; min-height:100%; overflow:hidden; }
  .vials-card .section-head h3 { font-size:15px; font-weight:800; }
  .vials-card .vial-list { overflow-y:auto; flex:1 1 auto; min-height:0; padding-right:2px; scrollbar-width:thin; }
  @media (max-width:1400px) { .card-trio { grid-template-columns:minmax(0,1fr) minmax(0,1fr); } .vials-card { grid-column:1 / -1; height:auto; } }
  @media (max-width:900px) { .card-trio { grid-template-columns:1fr; } }
  .prog-meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px 16px; margin:10px 0; font-size:13px; }
  .prog-meta .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .prog-meta .v { font-weight:500; }
  details summary { cursor:pointer; color:var(--accent); font-weight:600; font-size:13px; list-style:none; }
  details summary::before { content:"▸ "; }
  details[open] summary::before { content:"▾ "; }

  /* vial */
  .bar { height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; border:1px solid var(--border); }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .bar.low > i { background:var(--warn); }
  .bar.empty > i { background:var(--bad); }

  /* forms */
  .form { display:grid; gap:12px; }
  .grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; align-items:start; }
  .grid3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; align-items:start; }
  .field { display:grid; gap:4px; }
  .field label { font-size:12px; font-weight:600; color:var(--muted); }
  .field input, .field select, .field textarea { width:100%; border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface); padding:9px 10px; min-height:40px; }
  .field input[type="checkbox"], .field input[type="radio"], .checks input { width:auto; min-height:0; padding:0; margin:0; }
  .field textarea { min-height:80px; resize:vertical; }
  .field .help { font-size:12px; color:var(--faint); }
  .checks { display:flex; gap:6px; flex-wrap:wrap; }
  .checks label { display:inline-flex; align-items:center; gap:4px; padding:6px 10px; border:1px solid var(--border); border-radius:999px; font-size:13px; cursor:pointer; background:var(--surface); }
  .checks label:has(input:checked) { background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent); font-weight:600; }
  .checks input { margin:0; }
  .phases { display:grid; gap:6px; }
  .phase-row { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:6px; align-items:center; }
  .phase-row input { min-height:36px; padding:6px 8px; }
  .calc-out { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .calc-out .tile .v { font-family:var(--font-mono); font-size:22px; font-weight:600; }

  /* modal */
  .modal-bg { position:fixed; inset:0; background:rgba(10,14,13,.5); display:none; align-items:flex-end; justify-content:center; z-index:50; padding:0; }
  .modal-bg.open { display:flex; }
  .modal { background:var(--surface); width:100%; max-width:620px; max-height:92vh; overflow:auto; border-radius:16px 16px 0 0; padding:18px 18px 24px; border:1px solid var(--border); }
  .modal h2 { font-size:17px; font-weight:800; margin-bottom:12px; }
  .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
  @media (min-width:640px) { .modal-bg { align-items:center; padding:20px; } .modal { border-radius:16px; } }

  .chart { position:relative; }
  .chart svg { width:100%; height:auto; display:block; }
  .chart .tip { position:absolute; top:6px; transform:translateX(-50%); background:var(--ink); color:var(--bg); font-size:12px; padding:4px 8px; border-radius:6px; pointer-events:none; white-space:nowrap; }
  .chart .tip b { font-family:var(--font-mono); }
  .chart .tip div { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .chart .tip .small { color:var(--surface-2); opacity:.8; }
  .swatch { display:inline-block; width:10px; height:10px; border-radius:3px; flex:none; }
  .legend-item { display:inline-flex; align-items:center; gap:6px; font-size:13px; }
  .gsel { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px 20px; }
  .gsel-group .k { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:6px; }
  .gsel .checks label { font-size:12px; padding:4px 9px; }
  .gpanel { padding:10px 12px 6px; }
  .gbtn { appearance:none; border:0; border-left:1px solid var(--border); background:var(--surface); color:var(--muted); font-size:12px; font-weight:600; padding:5px 10px; cursor:pointer; }
  .gbtn:first-child { border-left:0; }
  .gbtn[aria-selected="true"] { background:var(--accent); color:var(--accent-ink); }
  .empty { text-align:center; padding:36px 16px; color:var(--muted); border:1px dashed var(--border); border-radius:var(--r-lg); }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-weight:600; font-size:14px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s; z-index:60; }
  .toast.show { opacity:1; }

  @media (max-width:760px) {
    .strip { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .dose-card { grid-template-columns:1fr; }
    .grid3 { grid-template-columns:1fr 1fr; }
    .calc-out { grid-template-columns:1fr; }
  }
  @media (max-width:480px) { .grid2, .grid3 { grid-template-columns:1fr; } .phase-row { grid-template-columns:1fr 1fr 1fr auto; } }
  @media (prefers-reduced-motion: reduce) { .toast { transition:none; } }

function ISO(d) { const z = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function today() { return P(ISO(new Date())); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function daysBetween(a, b) { return Math.round((P(ISO(b)) - P(ISO(a))) / DAY); }

/* ---------- storage ---------- */
const LS_KEY = 'peptide-tracker-v1';

const store = {

  loadLocal() { try { const raw = localStorage.getItem(LS_KEY); if (raw) this.data = { ...this.data, ...JSON.parse(raw) }; this.data.labs = this.data.labs || {}; } catch {} },
  saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.data)); } catch {} },
  async put(col, id, obj) {

    else { this.data[col][id] = obj; this.saveLocal(); render(); }
  },
  async del(col, id) {
    if (this.db) { try { await this.db.collection(col).doc(id).delete(); } catch (e) { toast('Delete failed: ' + (e.message || e.code)); throw e; } }
    else { delete this.data[col][id]; this.saveLocal(); render(); }
  },
  async init() {
    const badge = $('#storageBadge');
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { db = null; }
    if (db) {
      this.db = db; this.mode = 'cloud';
      badge.className = 'storage cloud'; badge.querySelector('span').textContent = 'Synced';
      let pending = 5;
      const done = () => { if (--pending <= 0 && !this.ready) { this.ready = true; render(); } else if (this.ready) render(); };
      for (const col of ['programs','vials','logs','settings','labs']) {
        db.collection(col).onSnapshot(snap => {
          const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
          this.data[col] = o; done();
        }, err => { toast('Sync error: ' + err.code); done(); });
      }
      setTimeout(() => { if (!this.ready) { this.ready = true; render(); } }, 8000);
    } else {
      this.mode = 'local'; this.loadLocal(); this.ready = true;
      badge.className = 'storage local'; badge.querySelector('span').textContent = 'This device only';
      render();
    }
    try { this.downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch { this.downloads = null; }
  }
};

/* ---------- domain ---------- */
const programs = () => Object.values(store.data.programs).sort((a,b) => (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name));
const vials = () => Object.values(store.data.vials);
const logs = () => Object.values(store.data.logs).sort((a,b) => b.at.localeCompare(a.at));

function isDue(p, d) {
  if (p.status !== 'active' || !p.startDate) return false;
  const start = P(p.startDate);
  if (d < start) return false;
  const end = programEnd(p); if (end && d > end) return false;
  const ci = cycleInfo(p, d); if (ci && !ci.on) return false;
  const f = p.freq || { type:'weekly' };
  const dow = d.getDay();
  if (f.type === 'daily') return true;
  if (f.type === 'weekly') return dow === ((f.days && f.days.length) ? f.days[0] : start.getDay());
  if (f.type === 'days') return (f.days || []).includes(dow);

}
function cycleInfo(p, d) {

  const start = P(p.startDate); const days = daysBetween(start, d); if (days < 0) return null;

}
function cycleLabel(p) {

  const f = n => n % 7 === 0 ? `${n / 7} wk` : `${n} d`;
  return `${f(c.onDays)} on / ${c.offDays ? f(c.offDays) + ' off' : 'no break'}${c.count ? ` · ${c.count} cycle${c.count > 1 ? 's' : ''}` : ' · repeats'}`;
}
function shotsPerWeek(p) {

}
function perShot(p, mg) { return mg == null ? null : (p.doseBasis === 'weekly' ? mg / shotsPerWeek(p) : mg); }

}

}
function scheduleComplete(p, d) { const end = programEnd(p); return !!(end && d > end); }
function nextDue(p, from, span=400) { for (let i=1;i<=span;i++) { const d = addDays(from, i); if (isDue(p, d)) return d; } return null; }
function freqLabel(p) {
  const f = p.freq || {}; const start = P(p.startDate);
  if (f.type === 'daily') return 'Daily';
  if (f.type === 'weekly') return 'Weekly · ' + DOW[(f.days && f.days.length) ? f.days[0] : (start ? start.getDay() : 6)];
  if (f.type === 'days') return (f.days || []).slice().sort().map(i => DOW[i]).join(' ') || 'No days set';
  if (f.type === 'everyN') return `Every ${f.everyN || 2} days`;

}
function activeVial(p) {
  const usable = usableVials(p);
  if (usable.length) return usable[0];
  return vials().filter(v => v.programId === p.id && !v.discarded && v.mixedDate).sort((a,b) => (b.mixedDate||'').localeCompare(a.mixedDate||''))[0] || null;
}
function byVialOrder(a, b) { return (a.order ?? 1e9) - (b.order ?? 1e9) || (a.mixedDate ? 0 : 1) - (b.mixedDate ? 0 : 1) || (a.mixedDate || '').localeCompare(b.mixedDate || '') || (a.createdAt || '').localeCompare(b.createdAt || ''); }
function programVials(p) { return vials().filter(v => v.programId === p.id && !v.discarded).sort(byVialOrder); }
function usableVials(p) {
  return programVials(p).filter(v => v.mixedDate).filter(v => { const st = vialStats(v); return !st.expired && st.remaining > 1e-9; });
}
async function saveVialOrder(ids) {
  for (let i = 0; i < ids.length; i++) { const v = store.data.vials[ids[i]]; if (v && v.order !== i) await store.put('vials', ids[i], { ...v, order: i }); }
}
function stockVials(p) { return programVials(p).filter(v => !v.mixedDate); 
}
function vialStats(v) {

  const conc = (v.totalMg > 0 && v.waterMl > 0) ? v.totalMg / v.waterMl : NaN;
  const used = logs().filter(l => l.vialId === v.id).reduce((a,l) => a + (l.doseMg || 0), 0);
  const remaining = v.totalMg - used;
  const mixed = P(v.mixedDate);

  const discardOn = mixed ? addDays(mixed, discardDays) : null;

}
function logsOn(p, d) { const iso = ISO(d); return logs().filter(l => l.programId === p.id && ISO(new Date(l.at)) === iso); }

  const out = []; const t = today();

  return sites.slice().sort((a,b) => (lastUsed[a] || '').localeCompare(lastUsed[b] || ''))[0];

/* ---------- pharmacokinetic level chart ---------- */
function pkParams(p) {
  const hl = num(p.halfLifeDays); if (!(hl > 0)) return null;
  const ke = Math.LN2 / hl; let ka = Math.LN2 / Math.max(0.2, num(p.absorbDays) || 1);

}

}

  const from = addDays(t0, -42).getTime(), to = addDays(t0, 28).getTime();

  const occ = occurrences(p);
  for (const r of (occ.rows || [])) if ((r.state === 'future' || r.state === 'today') && r.mg != null) doses.push({ t: P(r.iso).getTime(), mg: r.mg, actual: false });
  const pts = []; const step = 6 * 3600e3;
  for (let t = from; t <= to; t += step) pts.push({ t, v: levelAt(doses, t, k) });

  let trough = null; for (const q of pts) if (q.t <= now && q.t >= now - 14 * 86400e3 && (!trough || q.v < trough.v)) trough = q;
  return { k, doses, pts, now: nowV, peak, trough, from, to, nowT: now };

const chartData = {};
function levelChart(p) {
  const d = levelData(p); if (!d) return '';
  const id = 'lvl-' + p.id;
  if (!d.doses.length) return `<div class="card muted small">No doses logged or scheduled yet, so there is nothing to plot. Half-life is set to ${n(d.k.hl, 1)} days.</div>`;
  const W = 760, H = 210, L = 46, R = 14, T = 16, B = 30;
  const yMax = Math.max(d.peak.v, 1) * 1.12;
  const x = t => L + (t - d.from) / (d.to - d.from) * (W - L - R);
  const y = v => T + (1 - v / yMax) * (H - T - B);
  const past = d.pts.filter(q => q.t <= d.nowT), future = d.pts.filter(q => q.t >= d.nowT);
  if (past.length && future.length && future[0].t !== past[past.length - 1].t) future.unshift(past[past.length - 1]);
  const path = arr => arr.map((q, i) => `${i ? 'L' : 'M'}${x(q.t).toFixed(1)},${y(q.v).toFixed(1)}`).join(' ');
  const area = `${path(d.pts)} L${x(d.pts[d.pts.length - 1].t).toFixed(1)},${y(0)} L${x(d.pts[0].t).toFixed(1)},${y(0)} Z`;
  const step = yMax / 4; const nice = Math.pow(10, Math.floor(Math.log10(step))) * (step / Math.pow(10, Math.floor(Math.log10(step))) < 2 ? 1 : step / Math.pow(10, Math.floor(Math.log10(step))) < 5 ? 2 : 5);
  let grid = ''; for (let v = 0; v <= yMax; v += nice) grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--divider)"/><text x="${L - 6}" y="${y(v) + 3}" font-size="9" text-anchor="end" fill="var(--muted)" font-family="var(--font-mono)">${n(v, 0)}</text>`;

    <text x="${nowX + 4}" y="${T + 9}" font-size="9" fill="var(--muted)" font-family="var(--font-body)">today</text>
    <circle cx="${x(d.peak.t)}" cy="${y(d.peak.v)}" r="5" fill="var(--surface)"/><circle cx="${x(d.peak.t)}" cy="${y(d.peak.v)}" r="3.5" fill="var(--accent)"/>
    <text x="${x(d.peak.t) + (x(d.peak.t) > W - 90 ? -8 : 8)}" y="${y(d.peak.v) - 6}" font-size="9" text-anchor="${x(d.peak.t) > W - 90 ? 'end' : 'start'}" fill="var(--ink)" font-family="var(--font-body)">peak ${n(d.peak.v, 1)} mg</text>

    <div class="grid2">
      <div class="field"><label for="v-prog">Program</label><select id="v-prog" name="programId">${programs().map(x => `<option value="${x.id}" ${(v.programId||programId)===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}${v.programId && !store.data.programs[v.programId] ? `<option value="${esc(v.programId)}" selected>(deleted program)</option>` : ''}</select></div>
      <div class="field"><label for="v-label">Label</label><input id="v-label" name="label" value="${esc(v.label || (p ? p.name + ' vial' : ''))}" placeholder="e.g. Reta #3"></div>
    </div>
    <div class="field"><label for="v-mg">${sol ? 'Total mg in vial' : 'Peptide in vial (mg)'}</label><input id="v-mg" name="totalMg" type="number" step="0.01" min="0" required value="${totalMg}" style="max-width:220px"></div>
    <div class="field"><div class="checks"><label><input type="radio" name="mixed" value="yes" ${isMixed ? 'checked' : ''}> ${sol ? 'Opened / in use' : 'Reconstituted'}</label><label><input type="radio" name="mixed" value="no" ${isMixed ? '' : 'checked'}> ${sol ? 'Unopened (in stock)' : 'Not mixed yet (in stock)'}</label></div></div>
    <div id="v-mixfields" ${isMixed ? '' : 'hidden'}>
    <div class="grid2">
      <div class="field"><label for="v-ml">${sol ? 'Vial volume (mL)' : 'BAC water added (mL)'}</label><input id="v-ml" name="waterMl" type="number" step="0.01" min="0" value="${waterMl}"></div>
      <div class="field"><label>Concentration</label><div class="num" id="v-conc" style="padding:9px 0;font-weight:600">—</div></div>
    </div>
    <div class="grid2" style="margin-top:12px">
      <div class="field"><label for="v-date">${sol ? 'Opened on' : 'Mixed on'}</label><input id="v-date" name="mixedDate" type="date" value="${esc(v.mixedDate || ISO(new Date()))}"></div>
      <div class="field"><label for="v-discard">Discard after (days)</label><input id="v-discard" name="discardDays" type="number" min="1" value="${v.discardDays ?? store.settings.discardDays}"></div>
    </div>
    </div>
    <div class="field"><label for="v-notes">Notes</label><input id="v-notes" name="notes" value="${esc(v.notes||'')}" placeholder="Lot, supplier, fridge shelf…"></div>
    ${!isNew ? `<div class="checks"><label><input type="checkbox" name="discarded" ${v.discarded?'checked':''}> Discarded / finished</label></div>` : ''}
    <div class="modal-actions">${!isNew ? `<button type="button" class="btn danger ghost" data-action="del-vial" data-id="${v.id}">Delete</button><span class="spacer"></span>` : ''}<button type="button" class="btn" data-action="close">Cancel</button><button type="submit" class="btn primary">Save</button></div>
  </form>`);
  const form = $('#vialForm');
  const cap = p?.recipe?.capacityMl;
  const upd = () => { const a = num(form.totalMg.value), b = num(form.waterMl.value); $('#v-conc').innerHTML = (a > 0 && b > 0 ? `${n(a/b,2)} mg/mL · 1 mg = ${n(100/(a/b),1)} u` : '—') + (cap > 0 && b > cap ? ` <span class="chip bad">exceeds ${n(cap)} mL vial</span>` : ''); };
  form.totalMg.addEventListener('input', upd); form.waterMl.addEventListener('input', upd); upd();
  const syncMix = () => { const m = form.mixed.value === 'yes'; $('#v-mixfields').hidden = !m; form.waterMl.required = m; form.mixedDate.required = m; };
  $$('input[name="mixed"]', form).forEach(r => r.addEventListener('change', syncMix)); syncMix();
  form.addEventListener('submit', async e => {
    e.preventDefault(); const fd = new FormData(form);
    const mixed = fd.get('mixed') === 'yes';
    const obj = { ...v, programId: fd.get('programId'), label: fd.get('label').trim(), totalMg: num(fd.get('totalMg')), waterMl: mixed ? num(fd.get('waterMl')) : null, mixedDate: mixed ? fd.get('mixedDate') : null, discardDays: num(fd.get('discardDays')) || store.settings.discardDays, notes: fd.get('notes').trim(), discarded: fd.get('discarded') === 'on' };
    if (isNew) obj.createdAt = new Date().toISOString();
    closeModal(); await store.put('vials', v.id || uid(), obj); toast(isNew ? (mixed ? 'Vial added' : 'Vial added to stock') : (opts.mixNow ? 'Vial mixed' : 'Vial saved'));
  });
}

function logForm(programId) {
  const ps = programs().filter(p => p.status !== 'done');
  if (!ps.length) { toast('Add a program first'); return; }
  const pid = programId && store.data.programs[programId] ? programId : (ps.find(p => p.status==='active') || ps[0]).id;
  const now = new Date(); const z = k => String(k).padStart(2,'0');
  const localNow = `${ISO(now)}T${z(now.getHours())}:${z(now.getMinutes())}`;
  openModal(`<h2>Log a dose</h2>
  <form class="form" id="logForm">
    <div class="grid2">
      <div class="field"><label for="l-prog">Program</label><select id="l-prog" name="programId">${ps.map(x => `<option value="${x.id}" ${x.id===pid?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="l-when">When</label><input id="l-when" name="at" type="datetime-local" value="${localNow}" required></div>
    </div>
    <div class="grid3">
      <div class="field"><label for="l-mg">Dose (mg)</label><input id="l-mg" name="doseMg" type="number" step="0.001" min="0" required></div>
      <div class="field"><label for="l-units">Units drawn</label><input id="l-units" name="units" type="number" step="0.1" min="0"></div>
      <div class="field"><label>Vial</label><div class="small" id="l-vial" style="padding:9px 0">—</div></div>
    </div>
    <div id="l-gauge"></div>
    <div class="grid2">
      <div class="field"><label for="l-site">Injection site</label><select id="l-site" name="site"><option value="">—</option>${store.settings.sites.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div>
      <div class="field"><label for="l-note">Note</label><input id="l-note" name="note" placeholder="How it felt, side effects, fasted…"></div>
    </div>
    <div class="modal-actions"><button type="button" class="btn" data-action="close">Cancel</button><button type="submit" class="btn good">Save dose</button></div>
  </form>`);
  const form = $('#logForm');
  let vialId = null, conc = NaN, lock = false;
  const setup = () => {
    const p = store.data.programs[form.programId.value]; const d = P((form.at.value || localNow).slice(0,10));
    const v = activeVial(p); vialId = v ? v.id : null; conc = v ? vialStats(v).conc : NaN;
    $('#l-vial').innerHTML = v ? `<b>${esc(v.label||'Vial')}</b><br><span class="muted num">${n(conc,2)} mg/mL</span>` : `<span class="chip warn">No vial on file</span>`;
    const mg = doseFor(p, d); if (mg != null) form.doseMg.value = mg;
    form.site.value = suggestSite(p) || '';
    fromMg();
  };
  const fromMg = () => { if (lock) return; lock = true; const mg = num(form.doseMg.value); form.units.value = (mg != null && Number.isFinite(conc)) ? n(drawFor(mg, conc).units, 1) : ''; drawGauge(); lock = false; };
  const fromUnits = () => { if (lock) return; lock = true; const u = num(form.units.value); if (u != null && Number.isFinite(conc)) form.doseMg.value = n(u / 100 * conc, 3); drawGauge(); lock = false; };
  const drawGauge = () => { const u = num(form.units.value); $('#l-gauge').innerHTML = u != null ? gauge(u, 380, syringeFor(store.data.programs[form.programId.value])) : ''; };
  form.programId.addEventListener('change', setup); form.at.addEventListener('change', setup);
  form.doseMg.addEventListener('input', fromMg); form.units.addEventListener('input', fromUnits);
  setup();
  form.addEventListener('submit', async e => {
    e.preventDefault(); const fd = new FormData(form);
    const at = new Date(fd.get('at')); if (isNaN(at)) return;
    const mg = num(fd.get('doseMg')); if (mg == null) return;
    const units = num(fd.get('units'));
    const obj = { programId: fd.get('programId'), vialId, at: at.toISOString(), doseMg: mg, units, ml: units != null ? units / 100 : null, site: fd.get('site'), note: fd.get('note').trim(), createdAt: new Date().toISOString() };
    closeModal(); await store.put('logs', uid(), obj); toast('Dose logged');
  });
}

function calcModal(pid) {
  const p = store.data.programs[pid];
  if (p && calcDetail.forProgram !== pid) {
    const c = concFor(p); const v = c.vial; const t = today();
    const mgNow = p.status === 'active' ? doseFor(p, t) : (doseRange(p)?.lo ?? null);
    calcDetail.vialMg = v ? String(v.totalMg) : (p.recipe?.totalMg != null ? String(p.recipe.totalMg) : '');
    calcDetail.waterMl = v ? String(v.waterMl) : (p.recipe?.waterMl != null ? String(p.recipe.waterMl) : '');
    calcDetail.doseMg = mgNow != null ? String(mgNow) : '';
    calcDetail.forProgram = pid;
  }
  openModal(`<h2>Calculator${p ? ' · ' + esc(p.name) : ''}</h2><p class="small muted" style="margin-bottom:10px">Scratch math, nothing is saved. Preloaded from ${p && concFor(p).vial ? 'the current vial' : 'the default recipe'}.</p><div id="modal-calc"></div><div class="modal-actions"><button type="button" class="btn" data-action="close">Close</button></div>`);
  mountCalc($('#modal-calc'), calcDetail, { compact: true, prefix: 'mc', syr: p ? syringeFor(p) : null, capacityMl: p?.recipe?.capacityMl });
}
function settingsForm() {
  const s = store.settings;
  openModal(`<h2>Settings</h2><form class="form" id="settingsForm">
    <div class="grid2">
      <div class="field"><label for="s-syr">Default syringe for new programs</label><select id="s-syr" name="syringeUnits">${[[100,'1 mL · 100 units (U-100)'],[50,'0.5 mL · 50 units'],[30,'0.3 mL · 30 units']].map(([v,l]) => `<option value="${v}" ${s.syringeUnits==v?'selected':''}>${l}</option>`).join('')}</select><div class="help">Each program can override this in its own settings. Units are always 0.01 mL.</div></div>
      <div class="field"><label for="s-disc">Default discard window (days)</label><input id="s-disc" name="discardDays" type="number" min="1" value="${s.discardDays}"></div>
    </div>
    <div class="field"><label for="s-sites">Injection sites (one per line, rotated least-recent first)</label><textarea id="s-sites" name="sites">${esc(s.sites.join('\n'))}</textarea></div>
    <div class="small muted">Storage: ${store.mode === 'cloud' ? 'synced through this page, so any device that opens it sees the same data.' : 'this browser only. Use Export on the Logs tab to move data.'}</div>
    <div class="row" style="margin-top:6px"><button type="button" class="btn sm danger" data-action="reset-all">Reset all data…</button><span class="small muted">Deletes every program, vial, dose, lab result and setting${store.mode === 'cloud' ? ' from the shared database' : ' from this browser'}.</span></div>
    <div class="modal-actions"><button type="button" class="btn" data-action="close">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>`);
  $('#settingsForm').addEventListener('submit', async e => {
    e.preventDefault(); const fd = new FormData(e.target);
    closeModal();
    await store.put('settings', 'main', { syringeUnits: num(fd.get('syringeUnits')) || 100, discardDays: num(fd.get('discardDays')) || 28, sites: fd.get('sites').split('\n').map(x => x.trim()).filter(Boolean) });
    toast('Settings saved');
  });
}

function deleteProgramConfirm(id) {
  const p = store.data.programs[id]; if (!p) return;
  const pv = vials().filter(v => v.programId === id); const nLogs = logs().filter(l => l.programId === id).length;
  openModal(`<h2>Delete ${esc(p.name)}?</h2>
    <p>This removes the program <b>and everything attached to it</b>:</p>
    <ul style="margin:8px 0 12px 18px;padding:0;line-height:1.7">
      <li><b>${pv.length}</b> vial${pv.length === 1 ? '' : 's'}${pv.length ? ` (${pv.map(v => esc(v.label || 'Vial')).join(', ')})` : ''} — deleted with the program</li>
      <li><b>${nLogs}</b> logged dose${nLogs === 1 ? '' : 's'} — deleted, including the history in Logs and graphs</li>
    </ul>
    <div class="note-box" style="background:var(--warn-soft)">If this plan is simply finished and you want to keep the history, don't delete it: use <b>Mark complete</b> instead. A completed plan keeps its doses, vials and charts and drops out of Today.</div>
    <p class="small muted" style="margin-top:10px">There is no undo.</p>
    <div class="checks" style="margin-top:12px"><label><input type="checkbox" id="delAck"> I understand the vials and dose history will be deleted too</label></div>
    <div class="modal-actions">${p.status !== 'done' ? `<button type="button" class="btn" id="delComplete">Mark complete instead</button>` : ''}<span class="spacer"></span><button type="button" class="btn" data-action="close">Cancel</button><button type="button" class="btn danger" id="delGo" disabled>Delete everything</button></div>`);
  const mc = $('#delComplete'); if (mc) mc.addEventListener('click', async () => { closeModal(); await store.put('programs', id, { ...p, status: 'done' }); toast(`${p.name} marked complete`); });
  $('#delAck').addEventListener('change', e => { $('#delGo').disabled = !e.target.checked; });
  $('#delGo').addEventListener('click', async () => {
    closeModal();
    for (const v of pv) await store.del('vials', v.id);
    for (const l of logs().filter(l => l.programId === id)) await store.del('logs', l.id);
    await store.del('programs', id);
    if (currentView === 'program' && detailId === id) showView('today');
    toast(`Deleted ${p.name}, ${pv.length} vial${pv.length === 1 ? '' : 's'} and ${nLogs} dose${nLogs === 1 ? '' : 's'}`);
  });
}
function resetConfirm() {
  const counts = ['programs', 'vials', 'logs', 'labs'].map(c => `${Object.keys(store.data[c] || {}).length} ${c === 'logs' ? 'doses' : c === 'labs' ? 'lab results' : c}`).join(', ');
  openModal(`<h2>Reset all data?</h2><p>This deletes <b>${counts}</b> and your settings. There is no undo.</p><p class="small muted" style="margin-top:8px">If you might want any of it back, press Cancel and use Export on the Logs tab first.</p>
    <div class="checks" style="margin-top:12px"><label><input type="checkbox" id="resetAck"> I understand everything will be deleted</label></div>
    <div class="modal-actions"><button type="button" class="btn" data-action="close">Cancel</button><button type="button" class="btn danger" id="resetGo" disabled>Delete everything</button></div>`);
  $('#resetAck').addEventListener('change', e => { $('#resetGo').disabled = !e.target.checked; });
  $('#resetGo').addEventListener('click', async () => { closeModal(); await wipeAllData(); });
}
function confirmBox(msg, onYes) {
  openModal(`<h2>Are you sure?</h2><p>${esc(msg)}</p><div class="modal-actions"><button type="button" class="btn" data-action="close">Cancel</button><button type="button" class="btn danger" id="confirmYes">Delete</button></div>`);
  $('#confirmYes').addEventListener('click', async () => { closeModal(); await onYes(); });
}

async function exportData() {
  const payload = JSON.stringify({ exportedAt: new Date().toISOString(), ...store.data }, null, 2);
  const filename = `peptide-tracker-${ISO(new Date())}.json`;
  if (store.downloads) { try { await store.downloads.save({ filename, data: payload }); toast('Exported'); return; } catch (e) { if (e && e.code === 'cancelled') return; } }
  try { await navigator.clipboard.writeText(payload); toast('Copied JSON to clipboard'); } catch { toast('Export unavailable here'); }
}
function importData() {
  openModal(`<h2>Import</h2><p class="small muted" style="margin-bottom:10px">Paste an export, or choose the file. Entries with the same id are overwritten; nothing else is removed.</p>
    <div class="form"><input type="file" id="importFile" accept="application/json"><div class="field"><textarea id="importText" placeholder='{"programs":…}'></textarea></div></div>
    <div class="modal-actions"><button type="button" class="btn" data-action="close">Cancel</button><button type="button" class="btn primary" id="importGo">Import</button></div>`);
  $('#importFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) f.text().then(t => $('#importText').value = t); });
  $('#importGo').addEventListener('click', async () => {
    let j; try { j = JSON.parse($('#importText').value); } catch { toast('That is not valid JSON'); return; }
    closeModal(); let count = 0;
    for (const col of ['programs','vials','logs','settings','labs']) for (const [id, obj] of Object.entries(j[col] || {})) { await store.put(col, id, obj); count++; }
    toast(`Imported ${count} records`);
  });
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const tab = e.target.closest('.tab[data-view]'); if (tab) { showView(tab.dataset.view, tab.dataset.id); if (tab.dataset.view === 'program') renderProgramDetail(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action, id = b.dataset.id;
  const pm = store.data.programs, vm = store.data.vials;
  switch (a) {
    case 'close': closeModal(); break;
    case 'open-program': e.preventDefault(); showView('program', id); renderProgramDetail(); window.scrollTo(0, 0); break;
    case 'back': if (history.state && history.length > 1) history.back(); else showView('today'); break;
    case 'settings': settingsForm(); break;
    case 'calc': calcModal(id); break;
    case 'lab': labForm(b.dataset.preset); break;
    case 'del-lab': confirmBox('Delete this lab result?', () => store.del('labs', id)); break;
    case 'labscat': labsCat = b.dataset.cat; saveLabsCat(); $('#labs').innerHTML = labsView(); break;
    case 'jump-marker': {
      const card = document.getElementById('lab-card-' + b.dataset.id);
      if (currentView !== 'labs') { showView('labs'); }
      if (labsCat !== 'All' && !card) { labsCat = 'All'; saveLabsCat(); $('#labs').innerHTML = labsView(); }
      const target = document.getElementById('lab-card-' + b.dataset.id);
      if (target) { target.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      else toast(`No ${b.dataset.name || b.dataset.id} results logged yet`);
      break;
    }
    case 'gsort': genomeState.sort = b.dataset.sort; saveGenomeState(); $('#genome').innerHTML = genomeView(); break;
    case 'jump-genome': {
      genomeState.q = b.dataset.gene || ''; genomeState.cats = []; saveGenomeState();
      showView('genome'); $('#genome').innerHTML = genomeView(); window.scrollTo(0, 0);
      break;
    }
    case 'add-program': programForm({}); break;
    case 'edit-program': programForm(pm[id] || {}); break;
    case 'activate': await store.put('programs', id, { ...pm[id], status:'active', startDate: pm[id].startDate || ISO(new Date()) }); toast('Activated'); break;
    case 'set-status': await store.put('programs', id, { ...pm[id], status: b.dataset.status }); toast('Updated'); break;
    case 'del-program': deleteProgramConfirm(id); break;
    case 'add-vial': vialForm({}, b.dataset.program || (programs()[0] || {}).id); break;
    case 'edit-vial': vialForm(vm[id] || {}); break;
    case 'mix-vial': vialForm(vm[id] || {}, null, { mixNow: true }); break;

    case 'add-stock': vialForm({}, b.dataset.program || (programs()[0] || {}).id, { unmixed: true }); break;
    case 'discard-vial': await store.put('vials', id, { ...vm[id], discarded: true, discardedAt: new Date().toISOString() }); toast('Vial marked discarded'); break;
    case 'del-vial': confirmBox('Delete this vial record?', () => store.del('vials', id)); break;
    case 'del-vial-now': confirmBox(`Delete vial "${vm[id]?.label || 'Vial'}"? Doses logged from it stay in the log.`, () => store.del('vials', id)); break;
    case 'reset-all': resetConfirm(); break;
    case 'log': logForm(id); break;
    case 'complete': await completeDose(id, b.dataset.date); break;
    case 'skip': await skipDose(id, b.dataset.date); break;
    case 'unskip': await unskipDose(id, b.dataset.date); break;
    case 'del-log': confirmBox('Delete this log entry?', () => store.del('logs', id)); break;
    case 'export': exportData(); break;
    case 'import': importData(); break;
  }
});

render();
store.init();
})();
</script>
