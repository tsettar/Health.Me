services:
  # Cloudflare Tunnel: outbound-only connection to Cloudflare's edge, where
  # Cloudflare Access gates every request by email login before it ever
  # reaches this docker network. See DEPLOY.md for the one-time dashboard
  # setup (Tunnel + Public Hostname routing to http://health-me:8080, an
  # Access Application + Policy).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      health-me:
        condition: service_healthy

  health-me:
    build: .
    environment:
      HEALTHME_DATA_DIR: /dbdata
      # Local-dev-only auth bypass — every request is treated as this email,
      # no Cloudflare needed at all. MUST be empty in production: leaving it
      # set disables all real authentication. See app/auth.py.
      DEV_USER: ${DEV_USER:-}
      CF_TEAM_DOMAIN: ${CF_TEAM_DOMAIN:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_ACCESS_POLICY_ID: ${CF_ACCESS_POLICY_ID:-}
    volumes:
      - ./server-data:/dbdata
    # Bound to loopback only, for local debugging (curl localhost:8080) —
    # this must NEVER become a non-loopback or externally-reachable binding.
    # Cloudflare Access verification checks JWT *claims*, not a cryptographic
    # signature (see app/auth.py) — the actual security boundary is that
    # Cloudflare's Tunnel (reaching this container over the docker network by
    # service name, not this port) is the only path in. Any other ingress
    # would let an unauthenticated request straight through.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
