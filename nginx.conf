server {
    # Bound to loopback only: with network_mode: service:tailscale in
    # docker-compose.yml, this container shares the sidecar's network
    # namespace. A raw hit on the tailnet node's IP:8080 is refused because
    # nginx never listens on that interface -- only the Tailscale Serve
    # proxy (which connects via 127.0.0.1 inside the same namespace) can
    # reach it. See ../autotrader/docker-compose.yml for the same pattern.
    listen 127.0.0.1:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
